[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-15.0 F1800                 ; retract filament
    NOZZLE_CLEAN
    
    TURN_OFF_HEATERS
    E_FANS_OFF
    
    G90                                      ; absolute positioning
    ;G0 X{x_safe} Y{y_safe} Z{z_safe} F50000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F50000  ; park nozzle at rear
    
    M107                                     ; turn off fan
    
    ;BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    STATUS_OFF

[gcode_macro REAR]
gcode:
    ;{% if printer.homed_axes != 'XYZ' %}
	;	G28			#Home All Axes
	;{% endif %}
    G90
    G0 Z20 F1000
    G0 X50 Y350 F60000
    

[gcode_macro MIDDLE]
gcode:
    ;{% if printer.homed_axes != 'XYZ' %}
;		G28			#Home All Axes
	;{% endif %}
    G90
    G0 Z20 F1000
    G0 X175 Y175 F60000
  

[gcode_macro FRONT]
gcode:
    ;{% if printer.homed_axes != 'XYZ' %}
	;	G28			#Home All Axes
	;{% endif %}
    G90
    G0 Z80 F1000
    G0 X175 Y0 F60000
    

[gcode_macro E_FANS_ON]
gcode:
  SET_FAN_SPEED FAN=fan1 SPEED=0.4
  SET_FAN_SPEED FAN=fan2 SPEED=0.4

[gcode_macro E_FANS_OFF]
gcode:
    SET_FAN_SPEED FAN=fan1 SPEED=0.0
    SET_FAN_SPEED FAN=fan2 SPEED=0.0

