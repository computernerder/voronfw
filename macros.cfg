
#####################################################################
#   Macros
#####################################################################

[gcode_macro G32]
description: Home XY, proximity-home Z, run QGL, proximity-home Z again
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32

    G90

    SET_GCODE_VARIABLE MACRO=G28 VARIABLE=restore_status VALUE=0
    SET_GCODE_VARIABLE MACRO=QUAD_GANTRY_LEVEL VARIABLE=restore_status VALUE=0

    STATUS_HOMING
    G28 X Y
    BEACON_HOME_Z_PROXIMITY

    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    BEACON_HOME_Z_PROXIMITY


    SET_GCODE_VARIABLE MACRO=G28 VARIABLE=restore_status VALUE=1
    SET_GCODE_VARIABLE MACRO=QUAD_GANTRY_LEVEL VARIABLE=restore_status VALUE=1

    STATUS_READY

    RESTORE_GCODE_STATE NAME=STATE_G32


[gcode_macro GO_TO_PURGE_BUCKET]
description: Move toolhead to the purge bucket position
variable_x: 50
variable_y: 350
variable_z: 5
variable_safe_z: 20
variable_travel_speed: 60000
variable_z_speed: 5000
gcode:
    {% set x = params.X|default(printer["gcode_macro GO_TO_PURGE_BUCKET"].x)|float %}
    {% set y = params.Y|default(printer["gcode_macro GO_TO_PURGE_BUCKET"].y)|float %}
    {% set z = params.Z|default(printer["gcode_macro GO_TO_PURGE_BUCKET"].z)|float %}
    {% set safe_z = params.SAFE_Z|default(printer["gcode_macro GO_TO_PURGE_BUCKET"].safe_z)|float %}
    {% set travel_speed = params.F|default(printer["gcode_macro GO_TO_PURGE_BUCKET"].travel_speed)|int %}
    {% set z_speed = printer["gcode_macro GO_TO_PURGE_BUCKET"].z_speed|int %}

    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

    G90

    {% if "z" in printer.toolhead.homed_axes %}
        G1 Z{safe_z} F{z_speed}
    {% endif %}

    G1 X{x} Y{y} F{travel_speed}

    {% if "z" in printer.toolhead.homed_axes %}
        G1 Z{z} F{z_speed}
    {% endif %}
   
[gcode_macro PRINT_START]
description: Start print with Beacon proximity prep, nozzle clean, contact Z, adaptive mesh, purge
gcode:
    # Load variables
    {% set bed_temp = params.BED|default(40)|int %}
    {% set extruder_temp = params.EXTRUDER|default(200)|int %}
    {% set debug = params.DEBUG|default(0)|int %}

    E_FANS_ON

    {% if debug %}
        M118 PRINT_START DEBUG MODE: skipping heater waits and extrusion.
    {% endif %}

    # Start heating
    STATUS_HEATING
    {% if debug %}
        M118 DEBUG: Skipping M104/M190/M109.
    {% else %}
        M104 S170
        M190 S{bed_temp}
    {% endif %}

    # Safe machine alignment using Beacon proximity only
    G32

    # Move to purge/brush area before final nozzle heat
    GO_TO_PURGE_BUCKET SAFE_Z=20 Z=5

    # Heat nozzle to final print temperature
    STATUS_HEATING
    {% if debug %}
        M118 DEBUG: Skipping final nozzle heat to {extruder_temp}.
    {% else %}
        M109 S{extruder_temp}
    {% endif %}

    # Pull pressure off nozzle before brushing
    {% if debug %}
        M118 DEBUG: Skipping pre-clean retract.
    {% else %}
        G92 E0
        G1 E-2 F1800
    {% endif %}

    # Clean before contact probing
    NOZZLE_CLEAN

    # Final true nozzle Z reference
    BEACON_HOME_Z_CONTACT

    # Mesh after final contact Z
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Purge into bucket
    {% if debug %}
        M118 DEBUG: Skipping purge extrusion.
        GO_TO_PURGE_BUCKET SAFE_Z=20 Z=5
    {% else %}
        PURGE LENGTH=6 SPEED=300
    {% endif %}

    # Clean purge residue
    NOZZLE_CLEAN

    # Retract to prevent ooze while moving to print start
    {% if debug %}
        M118 DEBUG: Skipping post-purge retract.
    {% else %}
        G92 E0
        G1 E-1 F1800
    {% endif %}

    # Ready for slicer start move
    STATUS_PRINTING
    G90
    G1 Z10 F5000
    G1 X175 Y175 F60000

    # Put back the 1mm retraction before the print starts
    {% if debug %}
        M118 DEBUG: Skipping final prime.
    {% else %}
        G92 E0
        G1 E1 F300
        G92 E0
    {% endif %}
 

[gcode_macro PURGE]
description: Purge filament into the purge bucket
gcode:
    {% set length = params.LENGTH|default(6)|float %}
    {% set speed = params.SPEED|default(300)|float %}
    {% set debug = params.DEBUG|default(0)|int %}

    STATUS_CLEANING
    GO_TO_PURGE_BUCKET SAFE_Z=20 Z=5

    {% if debug %}
        M118 PURGE DEBUG MODE: skipping extrusion of {length}mm.
    {% else %}
        {% if not printer.extruder.can_extrude %}
            {action_raise_error("Hotend too cold to purge.")}
        {% endif %}

        G92 E0
        G1 E{length} F{speed}
        G92 E0
    {% endif %}


[gcode_macro CALIBRATE_EXTRUDE]
description: Extrude a measured filament length for e-steps/flow checks
gcode:
    {% set length = params.LENGTH|default(100)|float %}
    {% set speed = params.SPEED|default(300)|float %}
    {% set max_chunk = 50.0 %}
    {% set full_moves = (length // max_chunk)|int %}
    {% set remainder = (length - (full_moves * max_chunk))|float %}

    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Hotend too cold to extrude. Heat the nozzle first.")}
    {% endif %}

    {% if length <= 0 %}
        {action_raise_error("LENGTH must be greater than 0.")}
    {% endif %}

    SAVE_GCODE_STATE NAME=STATE_CALIBRATE_EXTRUDE
    M83
    {% for _ in range(full_moves) %}
        G1 E{max_chunk} F{speed}
    {% endfor %}
    {% if remainder > 0 %}
        G1 E{remainder} F{speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=STATE_CALIBRATE_EXTRUDE


[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|string %}
    {% set target = params.TARGET|float %}

    {% if heater == "extruder" %}
        {% if target > printer.extruder.target|float %}
            STATUS_HEATING
        {% elif target <= 0 %}
            STATUS_READY
        {% endif %}
    {% endif %}

    SET_HEATER_TEMPERATURE_BASE {rawparams}


[gcode_macro G28]
rename_existing: G28.1
variable_restore_status: 1
gcode:
    {% set restore_status = printer["gcode_macro G28"].restore_status|int %}

    STATUS_HOMING
    G28.1 {rawparams}

    {% if restore_status %}
        STATUS_READY
    {% endif %}


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: QUAD_GANTRY_LEVEL_BASE
variable_restore_status: 1
gcode:
    {% set restore_status = printer["gcode_macro QUAD_GANTRY_LEVEL"].restore_status|int %}

    STATUS_LEVELING
    QUAD_GANTRY_LEVEL_BASE {rawparams}

    {% if restore_status %}
        STATUS_READY
    {% endif %}
    

[gcode_macro BEACON_HOME_Z_PROXIMITY]
description: Home Z using Beacon proximity mode for safe positioning before nozzle cleaning
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G28 Z METHOD=proximity

[gcode_macro BEACON_HOME_Z_CONTACT]
description: Home Z using Beacon nozzle contact mode after nozzle cleaning
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G28 Z METHOD=contact




#####################################################################
#   Dial Indicator Manual Sweep
#   Uses manually verified dial indicator positions
#
#   Point 1: X25  Y97  Z23
#   Point 2: X25  Y347 Z23
#   Point 3: X305 Y347 Z23
#   Point 4: X305 Y97  Z23
#   Center:  X175 Y222 Z23
#####################################################################

[gcode_macro DIAL_SWEEP_START]
description: Start manual dial indicator sweep
variable_point: 0
variable_install_x: 175
variable_install_y: 0
variable_install_z: 80
variable_point_z: 23
variable_feed_xy: 15000
variable_feed_z: 600

gcode:
    {% set install_x = printer["gcode_macro DIAL_SWEEP_START"].install_x|float %}
    {% set install_y = printer["gcode_macro DIAL_SWEEP_START"].install_y|float %}
    {% set install_z = printer["gcode_macro DIAL_SWEEP_START"].install_z|float %}
    {% set feed_xy = printer["gcode_macro DIAL_SWEEP_START"].feed_xy|int %}
    {% set feed_z = printer["gcode_macro DIAL_SWEEP_START"].feed_z|int %}

    SAVE_GCODE_STATE NAME=STATE_DIAL_SWEEP
    G90

    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=0

    G1 Z{install_z} F{feed_z}
    G1 X{install_x} Y{install_y} F{feed_xy}

    M400
    M117 Install Dial Indicator
    M118 Install dial indicator, then run DIAL_SWEEP_NEXT.


[gcode_macro DIAL_SWEEP_NEXT]
description: Move to next dial indicator sweep point

gcode:
    {% set point = printer["gcode_macro DIAL_SWEEP_START"].point|int %}
    {% set z = params.Z|default(printer["gcode_macro DIAL_SWEEP_START"].point_z)|float %}
    {% set feed_xy = printer["gcode_macro DIAL_SWEEP_START"].feed_xy|int %}
    {% set feed_z = printer["gcode_macro DIAL_SWEEP_START"].feed_z|int %}
    {% set install_x = printer["gcode_macro DIAL_SWEEP_START"].install_x|float %}
    {% set install_y = printer["gcode_macro DIAL_SWEEP_START"].install_y|float %}
    {% set install_z = printer["gcode_macro DIAL_SWEEP_START"].install_z|float %}

    G90

    {% if point == 0 %}
        G1 X25 Y97 F{feed_xy}
        G1 Z{z} F{feed_z}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=1
        M117 Zero Dial at Point 1
        M118 Point 1: X25 Y97 Z{z}. Zero the indicator, then run DIAL_SWEEP_NEXT.

    {% elif point == 1 %}
        G1 X25 Y347 F{feed_xy}
        G1 Z{z} F{feed_z}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=2
        M117 Dial Point 2
        M118 Point 2: X25 Y347 Z{z}. Record reading, then run DIAL_SWEEP_NEXT.

    {% elif point == 2 %}
        G1 X305 Y347 F{feed_xy}
        G1 Z{z} F{feed_z}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=3
        M117 Dial Point 3
        M118 Point 3: X305 Y347 Z{z}. Record reading, then run DIAL_SWEEP_NEXT.

    {% elif point == 3 %}
        G1 X305 Y97 F{feed_xy}
        G1 Z{z} F{feed_z}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=4
        M117 Dial Point 4
        M118 Point 4: X305 Y97 Z{z}. Record reading, then run DIAL_SWEEP_NEXT.

    {% elif point == 4 %}
        G1 X175 Y222 F{feed_xy}
        G1 Z{z} F{feed_z}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=5
        M117 Dial Center Point
        M118 Center Point: X175 Y222 Z{z}. Record reading, then run DIAL_SWEEP_NEXT.

    {% elif point == 5 %}
        G1 X25 Y97 F{feed_xy}
        G1 Z{z} F{feed_z}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=6
        M117 Repeat Point 1
        M118 Repeat Point 1: X25 Y97 Z{z}. Check repeatability, then run DIAL_SWEEP_NEXT to park.

    {% else %}
        G1 Z{install_z} F{feed_z}
        G1 X{install_x} Y{install_y} F{feed_xy}
        M400
        SET_GCODE_VARIABLE MACRO=DIAL_SWEEP_START VARIABLE=point VALUE=0
        RESTORE_GCODE_STATE NAME=STATE_DIAL_SWEEP
        M117 Dial Sweep Complete
        M118 Dial sweep complete. Returned to front position.
    {% endif %}


[gcode_macro NOZZLE_CLEAN]
description: Scrub nozzle across brush
variable_x_min: 69
variable_x_max: 109
variable_y_start: 345
variable_y_step: 1.5
variable_z: 5
variable_safe_z: 20
variable_wipe_speed: 12000
variable_travel_speed: 60000
variable_z_speed: 5000
variable_passes: 5
gcode:
    {% set x_min = params.X_MIN|default(printer["gcode_macro NOZZLE_CLEAN"].x_min)|float %}
    {% set x_max = params.X_MAX|default(printer["gcode_macro NOZZLE_CLEAN"].x_max)|float %}
    {% set y_start = params.Y|default(printer["gcode_macro NOZZLE_CLEAN"].y_start)|float %}
    {% set y_step = params.Y_STEP|default(printer["gcode_macro NOZZLE_CLEAN"].y_step)|float %}
    {% set z = params.Z|default(printer["gcode_macro NOZZLE_CLEAN"].z)|float %}
    {% set safe_z = params.SAFE_Z|default(printer["gcode_macro NOZZLE_CLEAN"].safe_z)|float %}
    {% set wipe_speed = params.WIPE_SPEED|default(printer["gcode_macro NOZZLE_CLEAN"].wipe_speed)|int %}
    {% set travel_speed = params.TRAVEL_SPEED|default(printer["gcode_macro NOZZLE_CLEAN"].travel_speed)|int %}
    {% set z_speed = params.Z_SPEED|default(printer["gcode_macro NOZZLE_CLEAN"].z_speed)|int %}
    {% set passes = params.PASSES|default(printer["gcode_macro NOZZLE_CLEAN"].passes)|int %}

    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}

    {% if "z" not in printer.toolhead.homed_axes %}
        BEACON_HOME_Z_PROXIMITY
    {% endif %}

    STATUS_CLEANING
    G90

    # Move above brush
    G1 Z{safe_z} F{z_speed}
    G1 X{x_min} Y{y_start} F{travel_speed}
    G1 Z{z} F{z_speed}

    # Scrub across the brush with slight Y stepping
    {% for i in range(passes) %}
        {% set y = y_start + (i * y_step) %}
        G1 X{x_max} Y{y} F{wipe_speed}
        G1 X{x_min} Y{y + (y_step / 2.0)} F{wipe_speed}
    {% endfor %}

    # Final short zig-zag near center
    G1 X{((x_min + x_max) / 2.0) - 10} Y{y_start + (passes * y_step)} F{wipe_speed}
    G1 X{((x_min + x_max) / 2.0) + 10} Y{y_start + (passes * y_step) - 2} F{wipe_speed}
    G1 X{((x_min + x_max) / 2.0) - 10} Y{y_start + (passes * y_step)} F{wipe_speed}

    # Lift clear
    G1 Z{safe_z} F{z_speed}

    STATUS_READY 


